name: Deploy Zamolxis (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # Publicarea pică uneori cu o eroare temporară de la GitHub
      # („Fetching artifact metadata failed”); încercăm încă o dată după o pauză.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
