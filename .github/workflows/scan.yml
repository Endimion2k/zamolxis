name: Scanare săptămânală (reîmprospătează datele)

# Rulează scanerele pe runner-ul GitHub (acces liber la portal.just.ro),
# regenerează web/data.json și îl comite. Push-ul declanșează deploy-ul (pages.yml).
#
# Scanarea completă durează peste 2h. Ca să nu pierdem tot la timeout:
#  - fiecare scaner are pasul și limita lui de timp; construcția rulează oricum;
#  - baza (data/portal.db) se păstrează între rulări în cache, deci progresul
#    se adună de la o săptămână la alta (valurile se salvează per pârât).
on:
  schedule:
    - cron: "0 3 * * 1,4"   # luni și joi, 03:00 UTC; cache-ul nefolosit 7 zile se șterge
  workflow_dispatch:
    inputs:
      scanare:
        description: "Scanează portal.just.ro (nu = doar reconstruiește data.json din baza din cache)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write   # ca să poată porni deploy-ul (pages.yml) după commit

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Restaurează baza din rularea anterioară
        uses: actions/cache/restore@v4
        with:
          path: data/portal.db
          key: portal-db-${{ github.run_id }}
          restore-keys: portal-db-

      - name: Scanare registru (acțiuni colective)
        if: github.event_name == 'schedule' || inputs.scanare
        continue-on-error: true
        timeout-minutes: 20
        run: python scripts/run_scanner.py --throttle 0.5

      - name: Scanare valuri (pârâți cunoscuți)
        if: github.event_name == 'schedule' || inputs.scanare
        continue-on-error: true
        timeout-minutes: 200
        run: python scripts/run_cluster_scan.py --domenii pensii,fiscal,asigurari,recuperare,sanatate --since 2020-01-01 --prag 30 --throttle 0.4

      - name: Descoperire valuri noi
        if: github.event_name == 'schedule' || inputs.scanare
        continue-on-error: true
        timeout-minutes: 100
        run: python scripts/discover_waves.py --domenii imobiliare,turism,retail,telecom,servicii,investitii --since 2022-01-01 --prag 25 --throttle 0.4

      - name: Salvează baza pentru rularea următoare
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/portal.db
          key: portal-db-${{ github.run_id }}

      - name: Construiește data.json
        run: |
          cp web/data.json /tmp/data_vechi.json
          python scripts/build_static.py --data "$(date -I)"

      - name: Comite dacă datele sunt valide (nu suprascriem cu mai puțin)
        run: |
          read CAZ GRU CAZ0 GRU0 < <(python - <<'PY'
          import json
          n = json.load(open('web/data.json', encoding='utf-8'))
          v = json.load(open('/tmp/data_vechi.json', encoding='utf-8'))
          print(len(n['cazuri']), len(n['grupuri']), len(v['cazuri']), len(v['grupuri']))
          PY
          )
          echo "cazuri: $CAZ (înainte $CAZ0) · valuri: $GRU (înainte $GRU0)"
          if [ "$CAZ" -lt 50 ] || [ $((GRU * 10)) -lt $((GRU0 * 9)) ]; then
            echo "Export mai sărac decât cel publicat. Nu comit; baza rămâne în cache și se completează la rularea următoare."
            exit 0
          fi
          git config user.name "Zamolxis Bot"
          git config user.email "zamolxis@users.noreply.github.com"
          git add web/data.json
          if git diff --cached --quiet; then echo "Nicio schimbare."; else \
            git commit -m "Reîmprospătare date $(date -I)"; git pull --rebase; git push
            # Un push făcut cu GITHUB_TOKEN nu declanșează alte workflow-uri,
            # deci pornim explicit publicarea pe GitHub Pages.
            gh workflow run pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # GitHub dezactivează programarea după 60 de zile fără activitate în repo.
      # Dacă nu s-a mai comis nimic de mult, lăsăm un semn de viață.
      - name: Semn de viață (ține programarea activă)
        if: always()
        run: |
          ULTIM=$(git log -1 --format=%ct)
          if [ $(( ($(date +%s) - ULTIM) / 86400 )) -ge 40 ]; then
            git config user.name "Zamolxis Bot"
            git config user.email "zamolxis@users.noreply.github.com"
            date -u +%FT%TZ > .github/ultima-scanare
            git add .github/ultima-scanare
            git commit -m "Semn de viață: scanare $(date -I)"
            git pull --rebase; git push
          else
            echo "Ultimul commit are sub 40 de zile."
          fi
